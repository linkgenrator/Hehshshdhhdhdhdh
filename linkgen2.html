  <title>SVG & HTML Link Generator</title>
  <meta name="description" content="Create a self-contained browser link from a local or GitHub-hosted SVG or HTML file or generate custom wildcard domain links." />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes typewriter {
      from { max-width: 0; }
      to { max-width: 100%; }
    }
    @keyframes blinkCaret {
      from, to { border-color: transparent; }
      50% { border-color: #fb923c; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes twinkleSlow {
      0%, 100% { opacity: 0.15; transform: scale(0.9); }
      50% { opacity: 0.85; transform: scale(1.1); }
    }
    @keyframes meteor {
      0% {
        transform: rotate(-35deg) translateX(300px) translateY(-300px);
        opacity: 0;
      }
      15% { opacity: 1; }
      75% { opacity: 1; }
      100% {
        transform: rotate(-35deg) translateX(-900px) translateY(900px);
        opacity: 0;
      }
    }
    .star-twinkle-1 { animation: twinkle 3.2s infinite ease-in-out; transform-origin: center; }
    .star-twinkle-2 { animation: twinkle 4.8s infinite ease-in-out 1.5s; transform-origin: center; }
    .star-twinkle-3 { animation: twinkle 2.7s infinite ease-in-out 0.8s; transform-origin: center; }
    .star-twinkle-slow { animation: twinkleSlow 6.5s infinite ease-in-out 2.2s; transform-origin: center; }
    .meteor-1 { animation: meteor 8s linear infinite 1s; }
    .meteor-2 { animation: meteor 12s linear infinite 5s; }
    .meteor-3 { animation: meteor 9.5s linear infinite 8s; }

    .animate-float { animation: float 4s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulseGlow 5s ease-in-out infinite; }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .animate-fade-in-delayed { opacity: 0; animation: fadeIn 0.6s ease-out 0.2s forwards; }
    .animate-typewriter {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: bottom;
      border-right: 2px solid #fb923c;
      animation: typewriter 2s steps(28, end) forwards, blinkCaret 0.8s step-end infinite;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(9, 9, 11, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(161, 161, 170, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(251, 146, 60, 0.5);
    }
  </style>
</head>

  <script>
    (function () {
      const app = document.getElementById('app');

      const DOMAIN_OPTIONS = [
        { name: 'Xylora', domain: 'frozenorbit.dedyn.io' },
        { name: 'Zodiac', domain: 'frozen-zodiac.dedyn.io' },
        { name: '1key', domain: 'frozenkey.theworkpc.com' },
        { name: '1key', domain: 'frozen-1key-edu.dedyn.io' },
        { name: 'catclass', domain: 'portmathclasses.ccwu.cc' },
        { name: 'bestspark', domain: 'zakadoesnotlarp.ccwu.cc' },
        { name: 'polaris', domain: 'frozen-polaris.dedyn.io' },
        { name: 'Xylora', domain: 'frozen-link-drop.dedyn.io' },
        { name: 'krypton', domain: 'krypton-edu.mytunnel.org' },
        { name: 'NTH', domain: 'nth-frozen.dedyn.io' },
      ];

      let state = {
        service: 'xylora', // 'quizizz' | 'blooket' | 'xylora' | 'suggestions' | 'vault' | null
        source: 'file', // 'file' | 'github'
        fileType: 'svg', // 'svg' | 'html'
        selectedDomain: 'frozenorbit.dedyn.io', // 'frozenorbit.dedyn.io' | 'frozen-zodiac.dedyn.io'
        domainSearchQuery: '',
        vaultUnlocked: false,
        vaultCodeInput: '',
        vaultError: null,
        copiedVaultLink: null,
        githubUrl: '',
        file: null,
        dragging: false,
        xyloraSlug: '',
        result: null,
        error: null,
        copied: false,
        loading: false,
        showCleverPopup: true,
        showGreetingPopup: false,
      };

      let copiedTimeout = null;

      function pickFile(file) {
        if (!file) return;
        state.result = null;
        state.error = null;
        state.copied = false;
        const isSvg = /\.svg$/i.test(file.name);
        const isHtml = /\.html?$/i.test(file.name);
        if (!isSvg && !isHtml) {
          state.file = null;
          state.error = 'Only .svg or .html files are supported.';
        } else {
          state.fileType = isSvg ? 'svg' : 'html';
          state.file = file;
        }
        render();
      }

      async function handleCopy(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          state.copied = true;
          if (copiedTimeout) clearTimeout(copiedTimeout);
          copiedTimeout = setTimeout(() => {
            state.copied = false;
            render();
          }, 2000);
        } catch {
          state.error = "Couldn't copy — select the link and copy manually.";
        }
        render();
      }

      async function handleUpload(e) {
        e.preventDefault();
        state.error = null;
        state.result = null;
        state.loading = true;
        render();

        try {
          let text = '';

          if (state.source === 'file') {
            if (!state.file) {
              state.error = 'Choose a file first.';
              state.loading = false;
              render();
              return;
            }
            text = await state.file.text();
          } else {
            if (!state.githubUrl.trim()) {
              state.error = `Please enter a GitHub .${state.fileType} URL.`;
              state.loading = false;
              render();
              return;
            }
            const extRe = state.fileType === 'svg' ? /\.svg($|\?)/i : /\.html?($|\?)/i;
            if (!extRe.test(state.githubUrl)) {
              state.error = `URL must point to a .${state.fileType} file.`;
              state.loading = false;
              render();
              return;
            }
            const raw = state.githubUrl
              .replace('github.com', 'raw.githubusercontent.com')
              .replace('/blob/', '/');
            const res = await fetch(raw, { method: 'GET' });
            if (!res.ok) throw new Error(`Fetch failed (${res.status} ${res.statusText})`);
            text = await res.text();
          }

          if (state.fileType === 'svg' && !text.includes('<svg')) {
            throw new Error('Not a valid SVG file.');
          }
          if (state.fileType === 'html' && !/<html|<!doctype html/i.test(text)) {
            throw new Error('Not a valid HTML file.');
          }

          const mime = state.fileType === 'svg' ? 'image/svg+xml' : 'text/html';
          const bytes = new TextEncoder().encode(text);
          let binary = '';
          for (let i = 0; i < bytes.length; i += 0x8000) {
            binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          }
          state.result = `data:${mime};charset=utf-8;base64,${btoa(binary)}`;
        } catch (err) {
          state.error = err instanceof Error ? err.message : 'Upload failed.';
        } finally {
          state.loading = false;
        }
        render();
      }

      function generateXyloraLink(e) {
        e.preventDefault();
        state.error = null;
        state.copied = false;
        const slug = state.xyloraSlug
          .trim()
          .toLowerCase()
          .replace(/^\/+|\/+$/g, '');
        if (!slug) {
          state.error = 'Enter some text to put in front of the domain.';
          state.result = null;
          render();
          return;
        }
        if (!/^[a-z0-9-]+(\/[a-z0-9-]+)*$/i.test(slug)) {
          state.error = 'Only letters, numbers, hyphens, and / are allowed.';
          state.result = null;
          render();
          return;
        }
        const [sub, ...rest] = slug.split('/');
        const path = rest.length ? `/${rest.join('/')}` : '';
        state.result = `https://${sub}.${state.selectedDomain}${path}`;
        render();
      }

        if (!state.service) {
          renderPicker();
        } else {
          renderService();
        }
        bindPopupEvents();
      }

                  >
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>

                      <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.28C.46 8.21 0 10.05 0 12c0 1.95.46 3.79 1.28 5.42l4-3.15z"/>
                      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.28 6.58l4 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Log in with Google</span>
                  </button>

                  <button
                    type="button"
                    data-close-clever="true"
                    class="w-full py-3 px-4 bg-zinc-50 hover:bg-zinc-100 border border-zinc-200 text-zinc-700 font-semibold text-sm rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <i class="material-icons text-lg text-zinc-500">badge</i>
                    <span>Log in as Teacher or Staff</span>
                  </button>

                  <button
                    type="button"
                    data-close-clever="true"
                    class="w-full py-3 px-4 bg-zinc-900 hover:bg-zinc-800 text-white font-semibold text-sm rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <i class="material-icons text-lg text-orange-300">auto_awesome</i>
                    <span>Continue to Site</span>
                  </button>

                <div class="mt-6 pt-4 border-t border-zinc-100 text-center text-[11px] text-zinc-400 flex items-center justify-center gap-2">

          `;
        }

        if (state.showGreetingPopup) {
          html += `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm animate-fade-in">
              <div class="relative w-full max-w-md bg-zinc-950 text-white rounded-2xl p-6 sm:p-8 shadow-2xl border border-orange-400/40 space-y-5 overflow-hidden">
                <button
                  type="button"
                  data-close-greeting="true"
                  class="absolute top-4 right-4 text-zinc-400 hover:text-white transition-colors p-1 rounded-full hover:bg-zinc-800"

                >
                  <i class="material-icons text-xl">close</i>

                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full bg-orange-300 text-black flex items-center justify-center font-black text-lg shadow-md">
                    ❄️

                  <div>
                    <h3 class="text-base font-bold text-white flex items-center gap-1.5">
                      <span>Message from creator</span>
                      <span class="text-xs font-mono px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-300 border border-orange-400/30">@thetoasteddemise</span>

                <div class="p-4 rounded-xl bg-zinc-900 border border-zinc-800 text-sm text-zinc-200 leading-relaxed font-sans shadow-inner">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">

      function renderVaultForm() {

      function bindVaultEvents() {
        const inp = document.getElementById('vaultCodeInput');
        if (inp) {
          inp.addEventListener('input', (e) => {
            state.vaultCodeInput = e.target.value;
          });
        }

        const form = document.getElementById('vaultLoginForm');
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (state.vaultCodeInput.trim() === 'ZnJvemVu') {
              state.vaultUnlocked = true;
              state.vaultError = null;
              state.vaultCodeInput = '';
            } else {
              state.vaultError = 'Invalid access code. Access denied.';
            }
            render();
          });
        }

        const lockBtn = document.getElementById('lockVaultBtn');
        if (lockBtn) {
          lockBtn.addEventListener('click', () => {
            state.vaultUnlocked = false;
            state.vaultCodeInput = '';
            state.vaultError = null;
            render();
          });
        }

        document.querySelectorAll('[data-copy-vault-link]').forEach(btn => {
          btn.addEventListener('click', () => {
            const url = btn.getAttribute('data-copy-vault-link');
            if (url) {
              navigator.clipboard.writeText(url);
              state.copiedVaultLink = url;
              render();
              setTimeout(() => {
                if (state.copiedVaultLink === url) {
                  state.copiedVaultLink = null;
                  render();
                }
              }, 2000);
            }
          });
        });
      }

      function renderUploadForm() {
        return `
          <form id="uploadForm" class="space-y-5">

                >
                  <i class="material-icons text-4xl text-orange-300 group-hover:text-orange-200 mb-2 transition-colors">cloud_upload</i>
                  <div class="text-sm font-medium text-zinc-200">
                    ${state.file ? `<span class="text-orange-300 font-semibold">${escapeHtml(state.file.name)}</span>` : 'Drop your .svg or .html here'}
                  </div>
                  <div class="text-xs text-zinc-400 mt-1">

            <button
              type="submit"
              ${state.loading ? 'disabled' : ''}
              class="w-full py-3 px-4 rounded-xl bg-orange-400 hover:bg-orange-300 disabled:opacity-50 disabled:cursor-not-allowed text-black font-bold text-sm transition-all cursor-pointer flex items-center justify-center gap-2 shadow-md"
            >
              ${state.loading ? `
                <i class="material-icons animate-spin text-lg">sync</i>
                <span>Generating…</span>

      function bindUploadEvents() {
        const uploadForm = document.getElementById('uploadForm');
        if (uploadForm) {
          uploadForm.addEventListener('submit', handleUpload);
        }

        app.querySelectorAll('[data-source]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.source = btn.dataset.source;
            state.result = null;
            state.error = null;
            state.copied = false;
            render();
          });
        });

        app.querySelectorAll('[data-type]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.fileType = btn.dataset.type;
            state.result = null;
            state.error = null;
            state.copied = false;
            render();
          });
        });

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        if (dropzone && fileInput) {
          dropzone.addEventListener('click', () => fileInput.click());
          dropzone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              fileInput.click();
            }
          });
          dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            state.dragging = true;
            dropzone.classList.add('border-orange-400', 'bg-orange-500/10');
          });
          dropzone.addEventListener('dragleave', () => {
            state.dragging = false;
            dropzone.classList.remove('border-orange-400', 'bg-orange-500/10');
          });
          dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            state.dragging = false;
            pickFile(e.dataTransfer.files[0]);
          });
          fileInput.addEventListener('change', (e) => pickFile(e.target.files[0]));
        }

        const githubInput = document.getElementById('githubUrl');
        if (githubInput) {
          githubInput.addEventListener('input', (e) => {
            state.githubUrl = e.target.value;
          });
        }
      }

      function renderXyloraForm() {
        const query = (state.domainSearchQuery || '').trim().toLowerCase();
        const filtered = DOMAIN_OPTIONS.filter((opt) =>
          !query || opt.name.toLowerCase().includes(query) || opt.domain.toLowerCase().includes(query)
        );

        const domainGridHtml = filtered.length > 0
          ? `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
              ${filtered.map((opt) => `
                <button
                  type="button"
                  data-domain="${opt.domain}"
                  class="py-3 px-2 rounded-xl text-xs font-semibold border transition-all cursor-pointer flex flex-col items-center justify-center gap-0.5 text-center group hover:scale-[1.03] active:scale-[0.97] ${state.selectedDomain === opt.domain ? 'bg-orange-500/20 text-orange-200 border-orange-400 shadow-md shadow-orange-500/10' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700'}"
                >
                  <div class="flex items-center gap-1 font-bold">
                    <span>${opt.name}</span>
                    ${state.selectedDomain === opt.domain ? '<i class="material-icons text-sm text-orange-300">check_circle</i>' : ''}
                  </div>
                  <span class="font-mono text-[10px] opacity-80 truncate max-w-full">.${opt.domain}</span>
                </button>
              `).join('')}
            </div>`
          : `<div class="p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/80 text-center space-y-2">
              <p class="text-xs text-zinc-400 font-mono">No domains found matching "<span class="text-orange-300">${escapeHtml(state.domainSearchQuery)}</span>"</p>

                Clear search filter

        return `
          <form id="xyloraForm" class="space-y-6">

                <span class="block text-xs font-bold uppercase tracking-wider text-orange-300 flex items-center gap-1.5 font-mono">
                  <i class="material-icons text-base text-orange-300">dns</i>
                  <span>Select Domain Bar</span>
                </span>
                <span class="text-[11px] font-mono text-zinc-400">Active: <span class="text-orange-300 font-semibold">${state.selectedDomain}</span></span>
              </div>
              
              <!-- Search Domain Filter Bar -->
              <div class="relative flex items-center">
                <i class="material-icons absolute left-3 text-zinc-500 text-lg pointer-events-none">search</i>

                  id="domainSearchInput"
                  type="text"
                  placeholder="Search domains (e.g., NTH, catclass, polaris, 1key)..."
                  value="${escapeHtml(state.domainSearchQuery)}"
                  class="w-full pl-9 pr-8 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-orange-400/80 focus:ring-1 focus:ring-orange-400/30 transition-all font-mono"
                />
                ${state.domainSearchQuery ? `
                  <button
                    type="button"
                    id="clearSearchX"
                    class="absolute right-2.5 text-zinc-400 hover:text-white p-0.5 rounded-md hover:bg-zinc-800 transition-colors"
                    title="Clear search"
                  >
                    <i class="material-icons text-base">close</i>
                  </button>
                ` : ''}
              </div>

              ${domainGridHtml}
            </div>

            <!-- SLUG INPUT -->
            <div class="space-y-2">
              <label for="xyloraSlug" class="block text-sm font-medium text-zinc-200">Subdomain / Path Text</label>
              <div class="flex items-stretch rounded-xl border border-zinc-800 bg-zinc-950 overflow-hidden focus-within:border-orange-400 focus-within:ring-1 focus-within:ring-orange-400/30 transition-all">
                <input
                  id="xyloraSlug"
                  type="text"
                  placeholder="myfile"
                  value="${escapeHtml(state.xyloraSlug)}"
                  class="flex-1 bg-transparent px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none"
                />
                <span class="flex items-center px-3 sm:px-4 bg-orange-500/15 text-orange-300 font-mono text-xs sm:text-sm border-l border-zinc-800 whitespace-nowrap font-semibold">
                  .${state.selectedDomain}
                </span>
              </div>
              <p class="text-xs text-zinc-400">
                Whatever you type becomes the subdomain in front of <span class="font-mono text-orange-300 font-semibold">.${state.selectedDomain}</span>.
              </p>
            </div>

            <button
              type="submit"
              class="w-full py-3 px-4 rounded-xl bg-orange-400 hover:bg-orange-300 text-black font-bold text-sm transition-all cursor-pointer flex items-center justify-center gap-2 shadow-md"
            >
              <i class="material-icons text-lg">auto_awesome</i>
              <span>Generate wildcard link</span>
            </button>
          </form>
        `;
      }

      function bindXyloraEvents() {
        document.getElementById('xyloraForm').addEventListener('submit', generateXyloraLink);
        
        const searchInput = document.getElementById('domainSearchInput');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            state.domainSearchQuery = e.target.value;
            const cursorPos = e.target.selectionStart;
            render();
            const newInp = document.getElementById('domainSearchInput');
            if (newInp) {
              newInp.focus();
              newInp.setSelectionRange(cursorPos, cursorPos);
            }
          });
        }

        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            state.domainSearchQuery = '';
            render();
          });
        }

        const clearX = document.getElementById('clearSearchX');
        if (clearX) {
          clearX.addEventListener('click', () => {
            state.domainSearchQuery = '';
            render();
          });
        }

        document.getElementById('xyloraSlug').addEventListener('input', (e) => {
          state.xyloraSlug = e.target.value;
        });
        
        app.querySelectorAll('[data-domain]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.selectedDomain = btn.dataset.domain;
            state.result = null;
            state.error = null;
            render();
          });
        });

      function renderResult() {
        const isXylora = state.service === 'xylora';
        const note = isXylora
          ? `This link only resolves if that subdomain is actually set up on ${state.selectedDomain}.`
          : `This data link contains the complete ${state.fileType.toUpperCase()} file. It is not uploaded to ${state.service === 'quizizz' ? 'Quizizz' : 'Blooket'}, and those services may restrict data links.`;

        return `
          <div class="p-4 rounded-xl border border-orange-400/30 bg-zinc-950 space-y-3">
            <div class="text-xs font-bold uppercase tracking-wider text-orange-300 flex items-center justify-between font-mono">
              <span>Your working link</span>
              <span class="text-[10px] font-normal text-zinc-400 font-mono">Length: ${state.result ? state.result.length : 0} chars</span>
            </div>
            <div class="max-h-32 overflow-y-auto break-all rounded-lg bg-black p-3 font-mono text-[11px] text-zinc-200 border border-zinc-800 leading-relaxed select-all">
              ${escapeHtml(state.result)}
            </div>
            <p class="text-xs text-zinc-400 leading-normal">${note}</p>
            <div class="grid grid-cols-2 gap-3 pt-1">
              <button
                type="button"
                id="copyBtn"
                class="py-2.5 px-3 rounded-lg text-xs font-semibold border transition-all cursor-pointer flex items-center justify-center gap-1.5 ${state.copied ? 'border-orange-400 bg-orange-500/20 text-orange-200' : 'border-zinc-800 bg-zinc-950 text-zinc-200 hover:bg-zinc-900'}"
              >
                <i class="material-icons text-base">${state.copied ? 'check' : 'content_copy'}</i>
                <span>${state.copied ? 'Copied!' : 'Copy link'}</span>
              </button>

              <a
                href="${escapeHtml(state.result)}"
                target="_blank"
                rel="noreferrer"
                class="py-2.5 px-3 rounded-lg text-xs font-semibold border border-orange-400/40 bg-orange-500/15 hover:bg-orange-500/25 text-orange-300 transition-all text-center flex items-center justify-center gap-1.5"
              >
                <i class="material-icons text-base">open_in_new</i>
                <span>Open link</span>
              </a>
            </div>
          </div>
        `;
      }

      function bindResultEvents() {
        const copyBtn = document.getElementById('copyBtn');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => handleCopy(state.result));
        }
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      render();
    })();
  </script>
